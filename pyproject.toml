[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deploy-mujoco"
version = "0.1.0"
description = "MuJoCo deployment utilities for G1 policies."
requires-python = ">=3.10"
dependencies = [
  "mujoco==3.6.0",
  "glfw==2.10.0",
  "PyOpenGL==3.1.10",
  "numpy==2.2.6",
  "scipy==1.15.3",
  "PyYAML==6.0.3",
  "torch==2.10.0",
  "onnxruntime==1.23.2",
  "opencv-python",
]

[tool.setuptools]
py-modules = []
